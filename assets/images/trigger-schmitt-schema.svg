<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Schéma électrique d’un oscillateur à trigger de Schmitt et circuit RC</title>
  <desc id="desc">Montage avec AOP LM741, pont de rétroaction positive R1 R2, résistance R, condensateur C, alimentation symétrique et signaux Vout et VC.</desc>

  <rect width="1200" height="760" fill="#fffdf9"/>
  <rect x="36" y="36" width="1128" height="688" rx="22" fill="#ffffff" stroke="#e5d7c8" stroke-width="3"/>

  <defs>
    <style>
      .wire { fill: none; stroke: #25221f; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #5b554e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .accent { fill: none; stroke: #6fa4c2; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .soft { fill: #e7f4f8; stroke: #6fa4c2; stroke-width: 3; }
      .label { font-family: Inter, Arial, sans-serif; fill: #25221f; font-size: 27px; font-weight: 700; }
      .small { font-family: Inter, Arial, sans-serif; fill: #5b554e; font-size: 21px; font-weight: 600; }
      .blue { fill: #356f8d; }
    </style>
  </defs>

  <text x="70" y="86" class="label">Trigger de Schmitt + circuit RC</text>
  <text x="70" y="122" class="small">Oscillateur à AOP LM741 alimenté en ±15 V</text>

  <!-- Op amp -->
  <polygon points="430,260 430,500 700,380" fill="#fffdf9" stroke="#25221f" stroke-width="5" stroke-linejoin="round"/>
  <text x="515" y="388" class="label">LM741</text>
  <text x="446" y="324" class="label">+</text>
  <text x="450" y="452" class="label">−</text>

  <!-- Inputs and output -->
  <path class="wire" d="M305 320 H430"/>
  <path class="wire" d="M305 440 H430"/>
  <path class="wire" d="M700 380 H805"/>
  <circle cx="305" cy="320" r="7" fill="#25221f"/>
  <circle cx="305" cy="440" r="7" fill="#25221f"/>
  <circle cx="805" cy="380" r="7" fill="#25221f"/>
  <text x="825" y="388" class="label">Vs / Vout</text>
  <text x="828" y="420" class="small">signal carré</text>

  <!-- Power supply -->
  <path class="thin" d="M545 308 V215"/>
  <path class="thin" d="M545 452 V548"/>
  <text x="565" y="232" class="small">+15 V</text>
  <text x="565" y="552" class="small">−15 V</text>
  <path class="thin" d="M525 215 H565"/>
  <path class="thin" d="M525 548 H565"/>

  <!-- R1 feedback to non-inverting input -->
  <path class="wire" d="M805 380 V172 H615"/>
  <path class="wire" d="M430 172 H305 V320"/>
  <path class="wire" d="M615 172 l-15 -22 l-30 44 l-30 -44 l-30 44 l-30 -44 l-30 44 l-20 -22"/>
  <text x="492" y="135" class="small">R1 = 100 kΩ</text>
  <text x="112" y="283" class="small">Rétroaction positive</text>
  <path class="accent" d="M250 300 H300"/>

  <!-- R2 to ground -->
  <path class="wire" d="M305 320 V382"/>
  <path class="wire" d="M305 382 l-22 15 l44 30 l-44 30 l44 30 l-44 30 l22 15"/>
  <path class="wire" d="M305 532 V592"/>
  <path class="thin" d="M270 592 H340 M278 608 H332 M290 624 H320"/>
  <text x="105" y="452" class="small">R2 = 47 kΩ</text>
  <text x="243" y="654" class="small">Masse</text>

  <!-- RC branch on inverting input -->
  <path class="wire" d="M805 380 V440 H660"/>
  <path class="wire" d="M660 440 l-15 -22 l-30 44 l-30 -44 l-30 44 l-30 -44 l-30 44 l-20 -22"/>
  <path class="wire" d="M475 440 H305"/>
  <text x="540" y="405" class="small">R = 10 kΩ</text>
  <path class="wire" d="M305 440 V506"/>
  <path class="wire" d="M260 506 H350"/>
  <path class="wire" d="M260 536 H350"/>
  <path class="wire" d="M305 536 V592"/>
  <text x="118" y="533" class="small">C = 1 µF</text>
  <path class="accent" d="M365 526 V440"/>
  <path class="accent" d="M352 452 l13 -16 l13 16"/>
  <text x="382" y="500" class="small blue">VC</text>

  <!-- Explanatory blocks -->
  <rect x="860" y="165" width="250" height="145" rx="16" class="soft"/>
  <text x="884" y="205" class="small blue">Seuils d’hystérésis</text>
  <text x="884" y="244" class="small">V+ = β · Vsat</text>
  <text x="884" y="280" class="small">β = R2 / (R1 + R2)</text>

  <rect x="860" y="470" width="250" height="145" rx="16" fill="#efe8dc" stroke="#d7c7b8" stroke-width="3"/>
  <text x="884" y="510" class="small">Sortie Vs</text>
  <path class="accent" d="M890 560 H925 V530 H990 V590 H1055 V560 H1085"/>
  <text x="884" y="640" class="small">VC : charge / décharge</text>
  <path class="thin" d="M890 675 C925 640 960 640 990 675 S1050 710 1085 675"/>
</svg>
